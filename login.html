<!DOCTYPE html>
<html lang="id">
<head>
    <title>Login - Berkah Utama</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="card p-4">
        <div class="text-center mb-4">
            <i class="bi bi-shop text-success" style="font-size: 3rem;"></i>
            <h4 class="fw-bold text-success mt-2">Toko Berkah Utama</h4>
            <p class="text-muted small">Silakan login untuk masuk ke sistem kasir</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger p-2 text-center small" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary fw-bold small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-start-0 ps-0" placeholder="Masukkan username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary fw-bold small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-start-0 ps-0" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill"><i class="bi bi-box-arrow-in-right me-1"></i> Masuk Sistem</button>
        </form>
    </div>
</body>
</html>
