<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Toko Berkah Utama</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
        }
        .brand-icon {
            font-size: 3rem;
            color: #0d9488;
        }
        .brand-title {
            font-weight: 800;
            color: #0d9488;
            font-size: 1.65rem;
        }
        .form-control:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 0.25rem rgba(13, 148, 136, 0.2);
        }
        .btn-teal {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: #ffffff;
            border: none;
            font-weight: 700;
            padding: 12px;
            transition: all 0.3s;
        }
        .btn-teal:hover {
            background: linear-gradient(135deg, #0f766e, #115e59);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(13, 148, 136, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-card mx-3">
        <div class="text-center mb-4">
            <div class="brand-icon mb-2"><i class="bi bi-shop"></i></div>
            <h2 class="brand-title mb-1">Toko Berkah Utama</h2>
            <p class="text-muted small mb-0">Silakan login untuk masuk ke sistem admin</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 small rounded-3 text-center mb-3" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-light" placeholder="Masukkan username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-light" placeholder="Masukkan password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-teal w-100 rounded-pill mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Masuk Sistem
            </button>

            <div class="text-center">
                <a href="/" class="text-decoration-none small fw-semibold" style="color: #0d9488;">
                    <i class="bi bi-arrow-left me-1"></i> Kembali ke Katalog Toko
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
