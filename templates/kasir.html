<!DOCTYPE html>
<html lang="id">
<head>
    <title>Kasir - Berkah Utama</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .navbar { box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-pay { background: linear-gradient(45deg, #0d9488, #0f766e); border: none; padding: 12px; font-weight: bold; transition: all 0.3s;}
        .btn-pay:hover { transform: scale(1.01); box-shadow: 0 5px 15px rgba(13, 148, 136, 0.3); color: white;}
        .bank-label, .wallet-label { border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; background: white; padding: 12px 5px; text-align: center; height: 100%; }
        .btn-check:checked + .bank-label, .btn-check:checked + .wallet-label { border-color: #0d9488; background-color: #f0fdfa; transform: scale(1.03); box-shadow: 0 4px 10px rgba(13, 148, 136, 0.15); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-shop me-2"></i>Toke - Berkah Utama</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="/dashboard"><i class="bi bi-bar-chart-fill me-1"></i> Dashboard</a>
                <a class="nav-link active fw-bold text-teal" href="/kasir"><i class="bi bi-calculator-fill me-1"></i> Kasir</a>
                <a class="nav-link me-3" href="/barang"><i class="bi bi-box-seam-fill me-1"></i> Gudang</a>
                <a class="btn btn-sm btn-outline-light rounded-pill px-3 fw-bold" href="/logout"><i class="bi bi-box-arrow-right me-1"></i> Keluar</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card mx-auto bg-white" style="max-width: 580px;">
            <div class="card-header bg-white p-4 border-bottom-0 text-center">
                <div class="display-4 mb-2" style="color: #0d9488;"><i class="bi bi-cart-check-fill"></i></div>
                <h4 class="mb-0 fw-bold">Form Transaksi Kasir</h4>
            </div>
            <div class="card-body p-4 pt-0">
                <form method="POST" onsubmit="return confirm('Proses pembayaran ini?');">
                    <div class="mb-3">
                        <label class="fw-bold mb-2 text-secondary small">Pilih Barang</label>
                        <select name="id_barang" class="form-select bg-light p-2" required>
                            <option value="">-- Silakan pilih item sembako --</option>
                            {% for b in barang %}
                            <option value="{{ b.id_barang }}">{{ b.nama_barang }} (Sisa: {{ b.stok }} | Rp {{ b.harga }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold mb-2 text-secondary small">Jumlah Beli</label>
                        <input type="number" name="jumlah_beli" class="form-control bg-light p-2" min="1" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="fw-bold mb-2 text-secondary small">Metode Pembayaran</label>
                        <select id="pilihMetode" name="metode_pembayaran" class="form-select bg-light p-2" required>
                            <option value="Tunai">Uang Tunai</option>
                            <option value="QRIS">QRIS (Scan Barcode)</option>
                            <option value="Transfer Bank">Transfer Bank</option>
                            <option value="E-Wallet">E-Wallet</option>
                        </select>
                    </div>

                    <!-- Box QRIS -->
                    <div id="boxQris" class="text-center mb-4 p-3 bg-light rounded border" style="display: none;">
                        <p class="fw-bold text-success mb-2"><i class="bi bi-qr-code-scan"></i> Silakan Scan QRIS Berikut</p>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=Pembayaran+Sembako+Toko+Berkah+Utama" class="img-fluid border p-2 bg-white rounded shadow-sm">
                    </div>

                    <!-- Box Transfer Bank (Ikon Simbol Resmi Anti-Broken Image) -->
                    <div id="boxTransfer" class="mb-4" style="display: none;">
                        <label class="fw-bold mb-2 text-secondary small">Pilih Tujuan Bank:</label>
                        <div class="row g-2">
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="bankBCA" value="BCA">
                                <label class="bank-label d-block" for="bankBCA">
                                    <i class="bi bi-bank fs-4" style="color: #0066ae;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">BCA</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="bankBRI" value="BRI">
                                <label class="bank-label d-block" for="bankBRI">
                                    <i class="bi bi-bank fs-4" style="color: #00529c;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">BRI</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="bankMandiri" value="Mandiri">
                                <label class="bank-label d-block" for="bankMandiri">
                                    <i class="bi bi-bank fs-4" style="color: #003399;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">Mandiri</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="bankBNI" value="BNI">
                                <label class="bank-label d-block" for="bankBNI">
                                    <i class="bi bi-bank fs-4" style="color: #f15a24;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">BNI</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="bankBSI" value="BSI">
                                <label class="bank-label d-block" for="bankBSI">
                                    <i class="bi bi-bank fs-4" style="color: #00a39d;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">BSI</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="bankPermata" value="Permata">
                                <label class="bank-label d-block" for="bankPermata">
                                    <i class="bi bi-bank fs-4" style="color: #002b49;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">Permata</div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Box E-Wallet -->
                    <div id="boxWallet" class="mb-4" style="display: none;">
                        <label class="fw-bold mb-2 text-secondary small">Pilih E-Wallet:</label>
                        <div class="row g-2 justify-content-center">
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="walletDana" value="DANA">
                                <label class="wallet-label d-block" for="walletDana">
                                    <i class="bi bi-wallet2 fs-4" style="color: #118eea;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">DANA</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="walletOvo" value="OVO">
                                <label class="wallet-label d-block" for="walletOvo">
                                    <i class="bi bi-wallet2 fs-4" style="color: #4c2882;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">OVO</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="walletGopay" value="GoPay">
                                <label class="wallet-label d-block" for="walletGopay">
                                    <i class="bi bi-wallet2 fs-4" style="color: #00816a;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">GoPay</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="walletShopee" value="ShopeePay">
                                <label class="wallet-label d-block" for="walletShopee">
                                    <i class="bi bi-wallet2 fs-4" style="color: #ee4d2d;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">ShopeePay</div>
                                </label>
                            </div>
                            <div class="col-4">
                                <input type="radio" class="btn-check" name="bank_pilihan" id="walletLinkAja" value="LinkAja">
                                <label class="wallet-label d-block" for="walletLinkAja">
                                    <i class="bi bi-wallet2 fs-4" style="color: #ed1c24;"></i>
                                    <div class="fw-bold text-dark mt-1" style="font-size: 12px;">LinkAja</div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-pay text-white w-100 rounded-pill mt-3">
                        <i class="bi bi-check2-circle me-1"></i> Proses Pembayaran
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('pilihMetode').addEventListener('change', function() {
            var val = this.value;
            document.getElementById('boxQris').style.display = (val === 'QRIS') ? 'block' : 'none';
            document.getElementById('boxTransfer').style.display = (val === 'Transfer Bank') ? 'block' : 'none';
            document.getElementById('boxWallet').style.display = (val === 'E-Wallet') ? 'block' : 'none';
            
            var radios = document.querySelectorAll('input[name="bank_pilihan"]');
            radios.forEach(radio => radio.required = (val === 'Transfer Bank' || val === 'E-Wallet'));
        });
    </script>
</body>
</html>
